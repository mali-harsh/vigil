{{- if eq .Values.mode "server" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
data:
  vigil.yaml: |
{{ .Values.config | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "vigil.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.ha.enabled }}{{ .Values.ha.replicas }}{{ else }}1{{ end }}   # SQLite = single writer; HA needs postgres
  {{- if .Values.ha.enabled }}
  podManagementPolicy: Parallel
  {{- end }}
  serviceName: {{ include "vigil.name" . }}
  selector:
    matchLabels: {{- include "vigil.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vigil.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
    spec:
      {{- if .Values.discovery.rbac }}
      serviceAccountName: {{ include "vigil.name" . }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        fsGroup: 65532
      terminationGracePeriodSeconds: 20
      containers:
        - name: vigil
          image: {{ include "vigil.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/vigil/vigil.yaml"]
          {{- with .Values.existingSecret }}
          envFrom: [{secretRef: {name: {{ . }}}}]
          {{- end }}
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: VIGIL_ADVERTISE_URL   # standbys proxy to the leader here
              value: "http://$(POD_IP):8080"
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:   # every node is Ready: standbys proxy to the leader
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          securityContext: {{- include "vigil.securityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/vigil, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}   # SQLite temp files (root fs is read-only)
      volumes:
        - name: config
          configMap: {name: {{ include "vigil.name" . }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.ha.enabled }}
      affinity:   # spread replicas so one node failure can't take out both
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "vigil.selector" . | nindent 20 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}
{{- if and (eq .Values.mode "server") .Values.ha.enabled }}
{{- if lt (int .Values.ha.replicas) 2 }}{{ fail "ha.replicas must be >= 2" }}{{ end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1   # drain one node at a time; the other takes over
  selector:
    matchLabels: {{- include "vigil.selector" . | nindent 6 }}
{{- end }}
