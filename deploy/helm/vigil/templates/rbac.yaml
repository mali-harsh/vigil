{{- if and (eq .Values.mode "server") .Values.discovery.rbac }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vigil.name" . }}-discovery
  labels: {{- include "vigil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vigil.name" . }}-discovery
  labels: {{- include "vigil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vigil.name" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "vigil.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
