{{- if eq .Values.mode "agent" }}
{{- if not .Values.agent.server }}{{ fail "agent.server is required in agent mode" }}{{ end }}
{{- if not .Values.existingSecret }}{{ fail "existingSecret (holding the agent token) is required in agent mode" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vigil.name" . }}
  labels: {{- include "vigil.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicas }}
  strategy: {type: Recreate}   # never two agents reporting the same location
  selector:
    matchLabels: {{- include "vigil.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vigil.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: {{ include "vigil.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["agent", "-server", {{ .Values.agent.server | quote }}]
          env:
            - name: VIGIL_AGENT_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: {{ .Values.agent.tokenKey }}}
          securityContext: {{- include "vigil.securityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
